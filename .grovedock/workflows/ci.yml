# gd's checks on Grovedock. With this folder present, Grovedock runs only these workflows; the
# files in .github/workflows (macOS and Windows, fuzzing, CodeQL, Scorecard) stay with GitHub.
name: CI
on:
  push:
    branches: [main]
  change_request:
  manual:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: grovedock/checkout
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable, components: "clippy, rustfmt" }
      - name: Install protoc 29.3
        run: |
          case "$(uname -m)" in aarch64|arm64) a=aarch_64; sum=6427349140e01f06e049e707a58709a4f221ae73ab9a0425bc4a00c8d0e1ab32 ;; *) a=x86_64; sum=3e866620c5be27664f3d2fa2d656b5f3e09b5152b42f1bedbf427b333e90021a ;; esac
          curl -fsSL --retry 3 -o /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-$a.zip"
          echo "$sum  /tmp/protoc.zip" | sha256sum -c -
          mkdir -p "$HOME/.local" && unzip -qo /tmp/protoc.zip -d "$HOME/.local" bin/protoc 'include/*'
          echo "$HOME/.local/bin" >> "$GROVEDOCK_PATH"
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: gd over https
        run: |
          out=$(cargo run -q --locked --bin gd -- whoami https://cloud.grovedock.com 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "missing bearer token"
