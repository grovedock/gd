# The website's product name, links and list prices, in one place.
# scripts/build-site.sh replaces {{KEY}} in site/*.html with these values; a rename or a
# price change is a one-line edit here. One KEY=value per line; values are used verbatim.
# Keep the plan numbers equal to the billing service's plans.

NAME=Grovedock
SITE_URL=https://grovedock.com/
CLOUD_URL=https://cloud.grovedock.com/
REPO=https://github.com/grovedock/gd
CONTACT_EMAIL=hello@grovedock.com
SUPPORT_EMAIL=support@grovedock.com
SALES_EMAIL=sales@grovedock.com

# Free
FREE_PEOPLE=3
FREE_AGENTS=5
FREE_STORAGE=1 GB
FREE_PRIVATE_REPOS=5
FREE_RATE=300

# Team, rupees per month
TEAM_AGENT_ANNUAL=149
TEAM_PERSON_ANNUAL=599
TEAM_AGENT_MONTHLY=186
TEAM_PERSON_MONTHLY=749
TEAM_STORAGE=50 GB
TEAM_RATE=3,000

# Fair use: lands per paid agent per month before we talk
FAIR_USE_LANDS=3,000

# Enterprise (self-hosted Grovedock with support), rupees per year
SUPPORT_YEAR=2,40,000
SUPPORT_FOUNDING=1,20,000
SUPPORT_FOUNDING_CUSTOMERS=10
