[book]
title = "Grovedock"
description = "Documentation for Grovedock: an open protocol and reference server for source control at agent scale. One root. Thousands of agents."
authors = ["Grovedock"]
language = "en"
src = "."

[output.html]
site-url = "/docs/"
git-repository-url = "https://cloud.grovedock.com/grovedock/gd"
edit-url-template = "https://cloud.grovedock.com/grovedock/gd/code/docs/{path}"
additional-css = ["theme/gd.css"]
additional-js = ["theme/gd.js"]
default-theme = "light"
preferred-dark-theme = "navy"
no-section-label = true
# Page headings sit in the right rail (theme/gd.js), not under each chapter in the contents.
sidebar-header-nav = false

[output.html.search]
enable = true
