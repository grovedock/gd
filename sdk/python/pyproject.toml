[project]
name = "grovedock"
version = "3.5.1"
description = "Python client for Grovedock, source control for monorepos at agent scale"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["grpcio>=1.66", "protobuf>=5.28", "blake3>=1.0"]
keywords = ["source-control", "version-control", "monorepo", "grpc", "grovedock"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Software Development :: Version Control"]

[project.urls]
Homepage = "https://grovedock.com/"
Repository = "https://github.com/grovedock/gd"

[dependency-groups]
dev = ["pytest>=8", "grpcio-tools>=1.66"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grovedock"]
