name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

# Read-only by default; each job that writes asks for exactly what it needs.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Ubuntu: binaries need glibc 2.35+ (Debian 12, Ubuntu 22.04, RHEL 10).
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-apple-darwin,       os: macos-latest }  # cross-compiled on arm64
          - { target: aarch64-apple-darwin,      os: macos-latest }
          - { target: x86_64-pc-windows-msvc,    os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable, targets: "${{ matrix.target }}" }
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with: { repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - run: cargo build --release --locked --target ${{ matrix.target }} --bin gd --bin git-remote-gd
      - name: Package
        shell: bash
        run: |
          name="gd-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          cp "target/${{ matrix.target }}/release/gd$ext" "target/${{ matrix.target }}/release/git-remote-gd$ext" README.md LICENSE "$name/"
          if [[ "$ext" == ".exe" ]]; then 7z a "$name.zip" "$name" >/dev/null; f="$name.zip"; else tar czf "$name.tar.gz" "$name"; f="$name.tar.gz"; fi
          if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.target }}
          path: gd-*

  publish:
    needs: [binaries]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # Sigstore signing of the attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with: { path: dist, merge-multiple: true }
      # Signed SLSA build provenance for every archive: verify with
      # `gh attestation verify FILE --repo grovedock/gd`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        id: provenance
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      # The signed provenance also ships as a release asset, where verifiers (and the OpenSSF
      # Scorecard) look for it.
      - run: cp "${{ steps.provenance.outputs.bundle-path }}" "dist/gd-${{ github.ref_name }}.intoto.jsonl"
      # A software bill of materials for the release, attested against each archive.
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/gd-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
          sbom-path: dist/gd-${{ github.ref_name }}.spdx.json
      - name: Release notes from CHANGELOG
        run: awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          body_path: notes.md
          files: dist/*

  # Packages the published Linux binaries; no emulated compilation, so it takes a minute.
  crates:
    needs: publish
    if: github.event_name == 'push' && vars.PUBLISH_CRATES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable }
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with: { repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  pypi:
    needs: publish
    if: github.event_name == 'push' && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing: no token stored in the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv build
        working-directory: sdk/python
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with: { packages-dir: sdk/python/dist }

  npm:
    needs: publish
    if: github.event_name == 'push' && vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 24, registry-url: "https://registry.npmjs.org" }
      # Staged publishing: the token ("Read and write (stage only)") can only queue the version;
      # a maintainer approves it on npmjs.com with 2FA before it goes live. Needs npm >= 11.15.
      - run: npm install -g npm@11.16.0
      - run: npm ci && npm stage publish --provenance --access public
        working-directory: sdk/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
