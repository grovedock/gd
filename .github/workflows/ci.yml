name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable, components: "clippy, rustfmt" }
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with: { repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        # v2: the earlier cache held target/package, which cargo package leaves behind and the
        # cache action cannot restore.
        with: { prefix-key: "v2-lint" }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Unused dependencies
        uses: bnjbvr/cargo-machete@ac30a525c0a8d163a92d727b3ff079ee3f6ecb08 # v0.9.2
      - name: Crates package and build from their published tarballs
        run: cargo package --workspace --locked
      - name: Keep packaged crates out of the cache
        if: always()
        run: rm -rf target/package

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable }
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with: { repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - name: Enable the FUSE mount test
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq fuse3
          echo "GD_FUSE_TEST=1" >> "$GITHUB_ENV"
      - run: cargo test --workspace --locked

  databases:
    # Same contract suite against real Postgres and CockroachDB (Postgres wire protocol).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: gd, POSTGRES_DB: gd }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable }
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with: { repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Postgres contract
        env: { GD_TEST_POSTGRES_URL: "postgres://postgres:gd@localhost:5432/gd" }
        run: cargo test -p grovedock-adapters --test contract --locked postgres -- --nocapture
      - name: Start CockroachDB
        run: |
          docker run -d --name crdb -p 26257:26257 cockroachdb/cockroach:latest-v25.2 start-single-node --insecure
          for i in $(seq 1 60); do docker exec crdb ./cockroach sql --insecure -e 'select 1' && break; sleep 1; done
          docker exec crdb ./cockroach sql --insecure -e 'create database if not exists gd'
      - name: CockroachDB contract
        env: { GD_TEST_POSTGRES_URL: "postgres://root@localhost:26257/gd?sslmode=disable" }
        run: cargo test -p grovedock-adapters --test contract --locked postgres -- --nocapture

  s3:
    # Object storage adapter against a real S3 API (SeaweedFS).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable }
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with: { repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Start SeaweedFS (S3 API)
        run: |
          docker run -d --name s3 -p 8333:8333 chrislusf/seaweedfs:4.48 server -s3
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:8333/ && break; sleep 1; done
          curl -sf -X PUT http://localhost:8333/gd
      - name: S3 contract
        env:
          GD_TEST_S3_URL: s3://gd/ci
          AWS_ACCESS_KEY_ID: gd
          AWS_SECRET_ACCESS_KEY: gd-secret
          AWS_REGION: us-east-1
          AWS_ENDPOINT: http://localhost:8333
          AWS_ALLOW_HTTP: "true"
        run: cargo test -p grovedock-adapters --test contract --locked s3 -- --nocapture

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with: { token: "${{ secrets.GITHUB_TOKEN }}" }
