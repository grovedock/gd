name: An idea
description: Something gd should do, or do differently.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and where gd gets in the way. Start here rather than with a solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
  - type: textarea
    id: else
    attributes:
      label: What you do today instead
