name: Something doesn't work
description: A bug in gd, the protocol, the git bridge or an SDK.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
      placeholder: |
        gd land
        expected: landed as …
        got: …
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to make it happen again
      description: The smallest steps that show it. A script is perfect.
  - type: input
    id: version
    attributes:
      label: gd --version
      placeholder: gd 4.0.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows, Other]
    validations:
      required: true
  - type: markdown
    attributes:
      value: A security problem? Please don't file it here; see SECURITY.md.
