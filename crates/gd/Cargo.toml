[package]
name = "grovedock"
description = "Grovedock: source control for monorepos at agent scale. Command-line client (`gd`) and git remote helper"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "gd"

[[bin]]
name = "gd"
path = "src/main.rs"

[[bin]]
name = "git-remote-gd"
path = "src/bin/git-remote-gd.rs"

[dependencies]
grovedock-core.workspace = true
grovedock-adapters.workspace = true
grovedock-proto.workspace = true
grovedock-workflow.workspace = true
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
bytes.workspace = true
clap.workspace = true
blake3.workspace = true
futures.workspace = true
ignore.workspace = true
mimalloc.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
tempfile.workspace = true
shlex.workspace = true
prost.workspace = true
quick_cache.workspace = true
reqwest = { workspace = true, features = ["form", "stream"] }
rustls.workspace = true
rmcp.workspace = true
schemars.workspace = true
tokio.workspace = true
tonic.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
fuser.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nfsserve = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_ProjectedFileSystem", "Win32_System_LibraryLoader"] }

[dev-dependencies]
